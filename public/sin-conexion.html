<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · turnogym</title>
<style>
  /* Autocontenida a propósito: es la pantalla que se ve JUSTO cuando no hay
     red, así que no puede depender de ningún archivo que haya que bajar. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center; padding: 24px;
    background: #0a0d12; color: #f4f6f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .caja { max-width: 340px; text-align: center; }
  .icono {
    width: 64px; height: 64px; margin: 0 auto 20px;
    display: grid; place-items: center; border-radius: 18px;
    background: rgba(34, 211, 238, .12); border: 1px solid rgba(34, 211, 238, .3);
    color: #22d3ee;
  }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 8px; letter-spacing: -.02em; }
  p { margin: 0; font-size: 14.5px; line-height: 1.6; color: #9aa3b2; }
  button {
    margin-top: 22px; font: inherit; font-size: 14px; font-weight: 600;
    padding: 11px 22px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #22d3ee, #3b82f6); color: #0b0a10;
  }
  .marca { margin-top: 28px; font-size: 11px; color: #6b7280; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="caja">
    <div class="icono" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <path d="M12 20h.01"/>
      </svg>
    </div>
    <h1>Te quedaste sin señal</h1>
    <p>
      No pudimos cargar tu app. Fijate que tengas datos o wifi
      y volvé a intentar.
    </p>
    <button onclick="location.reload()">Reintentar</button>
    <div class="marca">turnogym</div>
  </div>
</body>
</html>
